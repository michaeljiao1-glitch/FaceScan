; Copy this file to config.ini and fill in your own values.

[database]
; SQLAlchemy connection URL for the clinic database. Examples:
;   SQL Server: mssql+pyodbc://user:pass@server/dbname?driver=ODBC+Driver+18+for+SQL+Server
;   MySQL:      mysql+pymysql://user:pass@host/dbname
;   PostgreSQL: postgresql+psycopg://user:pass@host/dbname
;   SQLite:     sqlite:///clinic.db
url = sqlite:///clinic.db
; Optional schema name (e.g. dbo). Leave blank for the default schema.
schema =
people_table = people
appointments_table = appointments

[faces]
; Local file that stores enrolled face embeddings (biometric data - keep it protected).
store_path = faces.db
; Recognition model and face detector from DeepFace.
model = Facenet512
detector = opencv
; Reject photos/screens held up to the camera (needs PyTorch installed).
anti_spoofing = false
; Leave blank to use DeepFace's tuned threshold for the model (lower = stricter).
threshold =

[visits]
; A second scan is only treated as "leaving" if at least this many minutes
; have passed since arrival. Prevents an accidental double scan checking a patient out.
min_minutes_before_checkout = 5

[camera]
index = 0
