; Copy this file to config.ini and fill in your own values.

[database]
; SQL Server connection string, in the same format your other software uses.
; Initial Catalog can be left out here and set with "database" below instead.
connection_string = Data Source=192.168.1.10;Persist Security Info=false;User ID=YOUR_USER;Password=YOUR_PASSWORD
; The clinic's database (Initial Catalog). Change this for each clinic, or start the app
; with:  python -m facescan_app --database cm_otherclinic
database = cm_demo
; ODBC driver installed on this PC (download "Microsoft ODBC Driver 18 for SQL Server").
odbc_driver = ODBC Driver 18 for SQL Server
; For a non-SQL Server database, remove connection_string and set a SQLAlchemy URL instead:
;   url = sqlite:///clinic.db
; Optional schema name. Leave blank for the default (dbo).
schema =
people_table = people
appointments_table = appointments

[faces]
; Local file that stores enrolled face embeddings (biometric data - keep it protected).
; {database} is replaced by the clinic database name, so each clinic has its own file.
store_path = faces_{database}.db
; Recognition model and face detector from DeepFace.
model = Facenet512
detector = opencv
; Reject photos/screens held up to the camera (needs PyTorch installed).
anti_spoofing = false
; Leave blank to use DeepFace's tuned threshold for the model (lower = stricter).
threshold =

[visits]
; A second scan is only treated as "leaving" if at least this many minutes
; have passed since arrival. Prevents an accidental double scan checking a patient out.
min_minutes_before_checkout = 5

[camera]
index = 0
